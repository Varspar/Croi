spring:
  application:
    name: croi
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/croi}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validateOnMigrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:anthropic/claude-3-haiku}
  api-url: https://openrouter.ai/api/v1/chat/completions

ollama:
  api-url: ${OLLAMA_API_URL:http://localhost:11434/api/embeddings}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

rag:
  chunk-size: ${RAG_CHUNK_SIZE:1000}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:200}

whisper:
  api-url: ${WHISPER_API_URL:http://localhost:8000/v1/audio/transcriptions}

piper:
  api-url: ${PIPER_API_URL:http://localhost:8888/tts}

recordings:
  directory: ${RECORDINGS_DIR:/tmp/croi-recordings}

# The voice webhook (POST /api/v1/voice/**) is called by Asterisk, which has no
# user session and therefore no JWT — it's excluded from JwtFilter in
# SecurityConfig and gated by this shared secret instead (X-Api-Key header).
# No default on purpose: if unset, VoiceCallController fails CLOSED (rejects
# every request) rather than silently running the webhook unauthenticated,
# same policy as RecaptchaService.
voice:
  webhook-api-key: ${VOICE_WEBHOOK_API_KEY:}

contact:
  admin-email: ${CONTACT_ADMIN_EMAIL:}
  from-email: ${CONTACT_FROM_EMAIL:}
  admin-panel-url: ${CONTACT_ADMIN_PANEL_URL:}

recaptcha:
  secret-key: ${RECAPTCHA_SECRET_KEY:}
  verify-url: https://www.google.com/recaptcha/api/siteverify

jwt:
  secret: ${JWT_SECRET:change-this-super-secret-key-min-32-characters-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.croi: INFO